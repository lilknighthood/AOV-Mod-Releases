name: Auto Release Mở Lem Mod

on:
  push:
    tags:
      - 'v*' # Chỉ chạy khi bạn đẩy thẻ phiên bản (vd: v1.3.0)

jobs:
  delivery_job:
    runs-on: ubuntu-latest
    steps:
      # Bước 1: Máy ảo lấy các file từ kho Private của bạn về
      - name: Checkout Source
        uses: actions/checkout@v4

      # Bước 2: Kiểm tra xem máy ảo đã thấy các file zip chưa (để bạn xem log)
      - name: List files for debugging
        run: ls -lh

      # Bước 3: Chuyển các file zip sang kho Public
      - name: Upload to Public Repo Release
        uses: softprops/action-gh-release@v2
        with:
          # ĐỊA CHỈ KHO PUBLIC CỦA BẠN
          repository: lilknighthood/AOV-Mod-Releases 
          
          # Token bí mật bạn đã cài trong Settings > Secrets
          token: ${{ secrets.RELEASE_TOKEN }}
          
          # Chỉ định đúng các file bạn muốn đưa lên
          files: |
            "Mờ Lem_*.zip"
            
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
